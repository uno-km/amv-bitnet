[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-bitnet"
version = "2.2.0"
description = "1.58-bit (i2_s) BitNet on-device inference SDK with verified ARM NEON & DotProd kernels for Android Termux & ARM64"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km", email = "dev@amevafoundation.org" }
]
keywords = ["bitnet", "llm", "arm64", "termux", "quantization", "neon", "dotprod"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
]
dependencies = ["requests>=2.28.0"]

# GPU acceleration (ameva-runtime / AMUDA) is optional and not a PyPI dependency:
# PyPI rejects direct URL references in package metadata, and these SDKs are not
# yet republished on PyPI (see https://github.com/uno-km/ameva-device-sdk). The code
# already lazy-imports ameva_device/ameva_component and fails loud with
# AMU_ERR_RUNTIME_REQUIRED (exit 69) if GPU execution is requested without them.
# To enable GPU: pip install https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl

[project.scripts]
amv-bitnet = "termux_bitnet.cli:main"

[project.entry-points."ameva.components"]
amv-bitnet = "termux_bitnet.adapter:create_adapter"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]

