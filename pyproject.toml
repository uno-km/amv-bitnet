[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-bitnet"
version = "2.1.0"
description = "1.58-bit (i2_s) BitNet on-device inference SDK with verified ARM NEON & DotProd kernels for Android Termux & ARM64"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km", email = "dev@amevafoundation.org" }
]
keywords = ["bitnet", "llm", "arm64", "termux", "quantization", "neon", "dotprod"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
]
dependencies = ["requests>=2.28.0", "ameva-device-sdk @ https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl#sha256=81e555feb798a1d84c5e605c831d80a33ecb579d32e14a74ca4674ad9ab03085", "ameva-component-sdk @ https://github.com/uno-km/ameva-component-sdk/releases/download/v0.1.2/ameva_component_sdk-0.1.2-py3-none-any.whl#sha256=6d02eaf3cbd0be9ed02ab24f279eb3736da8c3a1c28762e3411ee428931549c6"]

[project.scripts]
termux-bitnet = "termux_bitnet.cli:main"

[project.entry-points."ameva.components"]
termux-bitnet = "termux_bitnet.adapter:create_adapter"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]

